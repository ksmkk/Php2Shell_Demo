global
    log stdout format raw local0
    nbthread 1
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 5s

frontend local_lab
    bind *:8080
    default_backend php_target

backend php_target
    server php vulnerable:80 check resolvers docker init-addr libc,none

