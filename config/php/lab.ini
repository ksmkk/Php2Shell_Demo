; Misma configuración en ambas versiones para una comparación controlada.
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 8M
max_file_uploads = 4
max_input_vars = 1000
file_uploads = On
session.upload_progress.enabled = On
session.save_handler = files
session.save_path = "/tmp"
session.use_only_cookies = On
session.cookie_httponly = On
session.cookie_samesite = Lax
upload_tmp_dir = "/tmp"
log_errors = On
display_errors = Off
expose_php = Off

